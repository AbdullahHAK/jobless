apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobless-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: jobless-api
  template:
    metadata:
      labels:
        app: jobless-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: jobless-api
  namespace: {{ .Release.Namespace }}
  # ServiceMonitor's selector matches a Service's own metadata.labels, not
  # spec.selector (which only controls pod routing) - without this, Prometheus
  # silently never discovers the target. Found by actually checking
  # Prometheus's /api/v1/targets rather than assuming the ServiceMonitor
  # existing was enough.
  labels:
    app: jobless-api
spec:
  selector:
    app: jobless-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
