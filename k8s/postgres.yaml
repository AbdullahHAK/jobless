apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: jobless
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: jobless
spec:
  replicas: 1
  strategy:
    type: Recreate # single-writer volume, avoid two Postgres pods at once
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres # avoid postgres's "lost+found" mount-root complaint
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "jobless"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: jobless
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
