# For local KinD use only - values are plaintext here for readability.
# A real deployment would generate this via a secrets manager / sealed-secrets,
# never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: jobless
type: Opaque
stringData:
  POSTGRES_USER: jobless
  POSTGRES_PASSWORD: jobless
  POSTGRES_DB: jobless
  DATABASE_URL: postgresql://jobless:jobless@postgres:5432/jobless
