api:
  image:
    repository: jobless-api
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

scraper:
  image:
    repository: jobless-scraper
    tag: latest
    pullPolicy: IfNotPresent
  schedule: "0 3 * * *"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

frontend:
  image:
    repository: jobless-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

postgres:
  image: postgres:16-alpine
  storage: 1Gi

# For local/dev use only - override these in a separate values file or
# --set for anything real; never commit real credentials.
credentials:
  user: jobless
  password: jobless
  db: jobless
