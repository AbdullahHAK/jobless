name: Deploy Pages

# Publishes frontend/ (plain static HTML/CSS/JS, no build step) as-is to
# GitHub Pages. Triggers whenever frontend/ changes - including when
# daily-scrape.yml commits a fresh frontend/data/jobs.json, which is what
# makes the live site actually update every day with zero backend involved.
on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
