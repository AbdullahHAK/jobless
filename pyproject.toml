[project]
name = "jobless"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Abdullah", email = "abdullah.compscientist@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.139.0",
    "lxml>=6.1.1",
    "playwright>=1.61.0",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
jobless = "jobless:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
