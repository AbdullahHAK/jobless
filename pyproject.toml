[project]
name = "jobless"
version = "0.1.0"
description = "A daily-updated job board for the Pakistani software industry"
authors = [
    { name = "Abdullah", email = "abdullah.compscientist@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.139.0",
    "lxml>=6.1.1",
    "playwright>=1.61.0",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2.13.4",
    "requests>=2.34.2",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
jobless = "jobless:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Standard defaults (pyflakes + pycodestyle) plus import sorting - not going
# further (e.g. pydocstyle, complexity rules) since this project deliberately
# favors minimal comments/docstrings and small, direct functions already.
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures embed real HTML samples verbatim (for realism against the
# actual markup each scraper parses) - wrapping those lines would hurt
# readability without catching any real issue.
"tests/*" = ["E501"]
