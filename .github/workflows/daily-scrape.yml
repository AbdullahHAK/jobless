name: Daily Scrape

# Same schedule as the K8s CronJob (charts/jobless/templates/scraper-cronjob.yaml)
# - this workflow exists as a free, infra-free way to run the daily scrape
# against a hosted Postgres (e.g. Neon) for the MVP, without needing a
# cluster running anywhere. Requires a DATABASE_URL repo secret pointing at
# a real reachable Postgres instance.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: write is needed to push the regenerated frontend/data/jobs.json
    # back to main. pages/id-token: write let this job deploy to Pages itself -
    # a push made with the default GITHUB_TOKEN (below) does NOT trigger other
    # workflows, so pages-deploy.yml would never fire for this commit
    # otherwise. Deploying inline is what actually makes the site update daily.
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run scrapers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run jobless

      - name: Export static jobs.json for the website
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m jobless.export_static

      - name: Commit the updated jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/jobs.json
          git diff --staged --quiet && echo "no changes to commit" && exit 0
          git commit -m "Update job listings"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
