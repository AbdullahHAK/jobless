apiVersion: batch/v1
kind: CronJob
metadata:
  name: jobless-scraper
  namespace: jobless
spec:
  schedule: "0 3 * * *" # 03:00 daily
  concurrencyPolicy: Forbid # don't overlap if a run takes longer than a day
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: scraper
              image: jobless-scraper:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
